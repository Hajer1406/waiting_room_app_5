name: Flutter CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'

      - name: Create .env file for CI
        run: |
          touch .env
          echo "SUPABASE_URL=https://dymepxyaervslablepnw.supabase.co" >> .env
          echo "SUPABASE_ANON_KEY=dummy_key" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze code
        run: flutter analyze